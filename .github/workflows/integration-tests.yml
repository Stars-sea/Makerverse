name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Aspire E2E + Stress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # livestream-rs 子模块 URL 是 SSH 形式（.gitmodules），runner 上改为 HTTPS，
      # 以便 actions/checkout 用 GITHUB_TOKEN 拉取（公开仓库无需凭据）。
      - name: Rewrite submodule URL to HTTPS
        run: git config --global url."https://github.com/Stars-sea/livestream-rs.git".insteadOf "git@github.com:Stars-sea/livestream-rs.git"

      - uses: actions/checkout@v4
        with:
          submodules: recursive # livestream-rs：livestream-svc 镜像构建 + stress 工具

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Stress 测试（LivestreamStressTests）需要 cargo（构建 livestream-test-utils）与 ffmpeg；
      # livestream-test-utils 的 build.rs 用 tonic-prost-build，还需要 protoc（protobuf-compiler）。
      - name: Install ffmpeg and protoc
        run: sudo apt-get update && sudo apt-get install -y ffmpeg protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        # 与 livestream-rs ci.yml 相同的缓存策略；Stress 测试的 livestream-test-utils
        # 依赖树（tonic/prost）冷构建可达 10 分钟以上，必须跨 run 缓存。
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      # 预热 Stress 工具构建：cargo run（LivestreamStressTest）在测试预算（15 分钟）内
      # 首次冷构建依赖树有超时风险，这里提前构建并暴露 protoc 缺失等问题。
      - name: Pre-build stress test tool
        run: cargo build -p livestream-test-utils
        working-directory: livestream-rs

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # livestream-svc 镜像优先从子仓库 CI 推送的 GHCR 包拉取（按 submodule commit SHA 精确匹配，
      # 见 livestream-rs/.github/workflows/ci.yml）；镜像不存在（子仓库 CI 失败/历史 commit）时
      # 回退到本地预构建（下一步）。测试侧 AppHostFixture.RemoveDockerfileBuildInCi 在 CI 下
      # 移除 Dockerfile 构建注解，DCP 直接复用 livestream-svc:latest。
      - name: Pull pre-built livestream-svc image
        id: pull-livestream
        run: |
          sha="$(git -C livestream-rs rev-parse HEAD)"
          echo "submodule sha: ${sha}"
          if docker pull "ghcr.io/stars-sea/livestream-svc:${sha}"; then
            docker tag "ghcr.io/stars-sea/livestream-svc:${sha}" livestream-svc:latest
            echo "image=pulled" >> "$GITHUB_OUTPUT"
          else
            echo "image=missing" >> "$GITHUB_OUTPUT"
          fi

      # Fallback：GHCR 包缺失时的冷构建（cargo-chef 多阶段 release，远超 StartAsync 预算），
      # gha 层缓存跨 run 复用；USE_MIRROR=false 与 Dockerfile 的 CI 约定一致。
      - name: Pre-build livestream-svc image (cached)
        if: steps.pull-livestream.outputs.image == 'missing'
        uses: docker/build-push-action@v7
        with:
          context: ./livestream-rs
          file: ./livestream-rs/Dockerfile
          build-args: USE_MIRROR=false
          tags: livestream-svc:latest
          load: true
          cache-from: type=gha,scope=livestream-svc
          cache-to: type=gha,mode=max,scope=livestream-svc

      - name: Run integration tests
        run: dotnet test --no-build --verbosity normal

      # 若 CI 上 Stress 偶发失败，可先 `--filter "Category!=Stress"` 排除再排查。
